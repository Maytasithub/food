
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food App</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
body{
font-family: sans-serif;
background:#f3f4f6;
margin:0;
padding:20px;
}

.container{
max-width:700px;
margin:auto;
}

.header{
text-align:center;
margin-bottom:20px;
}

.header h1{
font-size:28px;
}

.card{
display:flex;
gap:10px;
margin-bottom:15px;
}

input{
flex:1;
padding:14px;
border:none;
border-radius:12px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

button{
padding:14px 18px;
border:none;
border-radius:12px;
background:#10b981;
color:white;
font-weight:bold;
cursor:pointer;
}

.search{
margin-bottom:15px;
}

.item{
background:white;
padding:12px;
border-radius:12px;
margin-bottom:10px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 3px 10px rgba(0,0,0,0.08);
}

.delete{
background:red;
padding:8px 12px;
border-radius:10px;
cursor:pointer;
color:white;
border:none;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>🍽️ รายการอาหาร</h1>
<p>เพิ่ม / ลบ / ค้นหา (ไม่ต้อง Login)</p>
</div>

<div class="card">
<input id="foodInput" placeholder="พิมพ์ชื่ออาหาร">
<button onclick="addFood()">เพิ่ม</button>
</div>

<input class="search" id="search" placeholder="ค้นหา..." oninput="render()">

<div id="list"></div>

</div>

<script>

// ===== SUPABASE CONFIG =====
const SUPABASE_URL = "https://ygzfsppclxwxflccpmpj.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlnemZzcHBjbHh3eGZsY2NwbXBqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4MzMwOTksImV4cCI6MjA5NjQwOTA5OX0.7LO9CyKrzrdYdaRJDv6yl5-JEQiSLlE7xyKDghAO2Igห";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let foods = [];

// ===== LOAD =====
async function load(){
const { data } = await client.from("foods").select("*").order("id",{ascending:false});
foods = data || [];
render();
}

// ===== ADD =====
async function addFood(){

const name = document.getElementById("foodInput").value.trim();
if(!name) return alert("กรอกก่อน");

await client.from("foods").insert([{ name }]);

document.getElementById("foodInput").value="";
load();
}

// ===== DELETE =====
async function del(id){
await client.from("foods").delete().eq("id",id);
load();
}

// ===== RENDER =====
function render(){

const key = document.getElementById("search").value.toLowerCase();

const filtered = foods.filter(f =>
f.name.toLowerCase().includes(key)
);

const list = document.getElementById("list");
list.innerHTML = "";

filtered.forEach(f=>{
list.innerHTML += `
<div class="item">
<span>${f.name}</span>
<button class="delete" onclick="del(${f.id})">ลบ</button>
</div>
`;
});

}

// ===== ENTER KEY =====
document.getElementById("foodInput")
.addEventListener("keydown",(e)=>{
if(e.key==="Enter") addFood();
});

load();

</script>

</body>
</html>
