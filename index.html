<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍽️ รายการอาหาร</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{background:#f3f4f6;min-height:100vh;}
.container{max-width:600px;margin:auto;padding:20px;padding-bottom:100px;}
.header{text-align:center;margin-bottom:20px;}
.header h1{font-size:32px;color:#111827;}
.header p{color:#6b7280;margin-top:5px;}
.search{width:100%;padding:14px;border:none;border-radius:15px;font-size:16px;background:white;box-shadow:0 3px 12px rgba(0,0,0,.08);margin-bottom:15px;}
.count{margin-bottom:15px;color:#6b7280;font-weight:600;}
.item{background:white;padding:15px;border-radius:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 3px 12px rgba(0,0,0,.08);}
.food-name{font-size:18px;font-weight:600;word-break:break-word;}
.actions{display:flex;gap:8px;}
.edit-btn, .delete-btn{width:42px;height:42px;border:none;border-radius:50%;font-size:18px;cursor:pointer;}
.edit-btn{background:#f59e0b;color:white;}
.delete-btn{background:#ef4444;color:white;}
.fab{position:fixed;bottom:20px;right:20px;width:65px;height:65px;border:none;border-radius:50%;background:#10b981;color:white;font-size:34px;cursor:pointer;box-shadow:0 5px 15px rgba(0,0,0,.25);}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);display:none;justify-content:center;align-items:center;padding:20px;}
.modal-content{background:white;width:100%;max-width:400px;padding:20px;border-radius:20px;}
.modal-content h2{margin-bottom:15px;}
.modal-content input{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;margin-bottom:15px;}
.modal-buttons{display:flex;gap:10px;}
.modal-buttons button{flex:1;padding:12px;border:none;border-radius:10px;cursor:pointer;}
.save-btn{background:#10b981;color:white;}
.cancel-btn{background:#e5e7eb;}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🍽️ รายการอาหาร</h1>
    <p>เพิ่ม แก้ไข ลบ ได้ทันที</p>
  </div>
  <input type="text" class="search" id="searchInput" placeholder="🔍 ค้นหารายการ..." oninput="renderFoods()">
  <div class="count" id="count">ทั้งหมด 0 รายการ</div>
  <div id="foodList"></div>
</div>

<button class="fab" onclick="openAddModal()">+</button>

<div class="modal" id="modal">
  <div class="modal-content">
    <h2 id="modalTitle">เพิ่มรายการ</h2>
    <input type="text" id="foodInput" placeholder="เช่น พริกน้ำปลา">
    <div class="modal-buttons">
      <button class="save-btn" onclick="saveFood()">บันทึก</button>
      <button class="cancel-btn" onclick="closeModal()">ยกเลิก</button>
    </div>
  </div>
</div>

<script>
// ประกาศแค่รอบเดียวจบ ไม่มีซ้ำแน่นอน
const SUPABASE_URL = "https://ygzsppclxwxflccpmpj.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlnemZzcHBjbHh3eGZsY2NwbXBqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4MzMwOTksImV4cCI6MjA5NjQwOTA5OX0.7LO9CyKrzrdYdaRJDv6yl5-JEQiSLlE7xyKDghAO2Ig";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let foods = [];
let editId = null;

async function loadFoods(){
    try {
        const { data, error } = await supabase.from('foods').select('*').order('id', { ascending: false });
        if (error) { console.error(error); return; }
        foods = data || [];
        renderFoods();
    } catch (err) { console.error(err); }
}

function renderFoods(){
    const keyword = document.getElementById('searchInput').value.toLowerCase();
    const filtered = foods.filter(item => item.name && item.name.toLowerCase().includes(keyword));
    document.getElementById('count').innerText = `ทั้งหมด ${filtered.length} รายการ`;
    const list = document.getElementById('foodList');
    list.innerHTML = '';
    filtered.forEach(food => {
        const safeName = food.name.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        list.innerHTML += `<div class="item"><div class="food-name">${food.name}</div><div class="actions"><button class="edit-btn" onclick="editFood(${food.id}, '${safeName}')">✏️</button><button class="delete-btn" onclick="deleteFood(${food.id})">🗑️</button></div></div>`;
    });
}

function openAddModal(){ 
    editId = null; 
    document.getElementById('modalTitle').innerText = 'เพิ่มรายการ'; 
    document.getElementById('foodInput').value = ''; 
    document.getElementById('modal').style.display = 'flex'; 
}

function editFood(id, name){ 
    editId = id; 
    document.getElementById('modalTitle').innerText = 'แก้ไขรายการ'; 
    document.getElementById('foodInput').value = name; 
    document.getElementById('modal').style.display = 'flex'; 
}

function closeModal(){ 
    document.getElementById('modal').style.display = 'none'; 
}

async function saveFood(){
    const name = document.getElementById('foodInput').value.trim();
    if(!name){ alert('กรุณากรอกข้อมูล'); return; }
    try {
        if(editId){ 
            const { error } = await supabase.from('foods').update({ name: name }).eq('id', editId); 
            if (error) throw error; 
        } else { 
            const { error } = await supabase.from('foods').insert([{ name: name }]); 
            if (error) throw error; 
        }
        closeModal(); 
        loadFoods();
    } catch (error) { 
        alert("เกิดข้อผิดพลาด: " + error.message); 
    }
}

async function deleteFood(id){
    if(!confirm('ลบรายการนี้?')) return;
    try { 
        const { error } = await supabase.from('foods').delete().eq('id', id); 
        if (error) throw error; 
        loadFoods(); 
    } catch (error) { 
        alert("เกิดข้อผิดพลาด: " + error.message); 
    }
}

// เรียกทำงานตอนโหลดหน้าเว็บ
loadFoods();
</script>

</body>
</html>
